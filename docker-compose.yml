# Docker Compose для Timeweb Cloud App Platform.
#
# App Platform сам выдаёт бесплатный технический домен с HTTPS и проксирует
# трафик с 80/443 на порт первого сервиса (здесь 8000).
#
# ВАЖНО: в контейнер попадают только переменные, перечисленные ниже в
# `environment` (Timeweb подставляет их из панели через ${...}). Если переменной
# нет в этом списке — она не дойдёт до приложения, даже если задана в панели.
#
# Обязательна только BOT_TOKEN. Остальные опциональны (дефолты в ${VAR:-...}).

services:
  bot:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8000
      - PORT=8000
      - WEBAPP_DEV_MODE=${WEBAPP_DEV_MODE:-false}
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///data/market_tracker.db}
      - WEBAPP_URL=${WEBAPP_URL:-}
      # Прокси для парсеров (Avito/Яндекс). Именно он был забыт раньше:
      - PARSER_PROXY_URL=${PARSER_PROXY_URL:-}
      # Прокси для Telegram Bot API (если api.telegram.org блокируется):
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      # Прочие настройки (менять не обязательно):
      - KEEP_ALIVE=${KEEP_ALIVE:-false}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-15}
      - ALERT_COOLDOWN_HOURS=${ALERT_COOLDOWN_HOURS:-24}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
