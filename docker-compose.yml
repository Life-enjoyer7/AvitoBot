# Docker Compose для Timeweb Cloud App Platform.
#
# App Platform сам выдаёт бесплатный технический домен с HTTPS и проксирует
# трафик с 80/443 на порт первого сервиса (здесь 8000).
#
# Обязательная переменная в панели Timeweb — только BOT_TOKEN.
# DATABASE_URL и WEBAPP_URL опциональны: если не заданы, используется
# SQLite (внутри контейнера) и, соответственно, кнопка меню не ставится.

services:
  bot:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8000
      - PORT=8000
      - WEBAPP_DEV_MODE=false
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///data/market_tracker.db}
      - WEBAPP_URL=${WEBAPP_URL:-}
